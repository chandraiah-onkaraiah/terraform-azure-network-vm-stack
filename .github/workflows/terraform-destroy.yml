
name: Terraform Azure Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      confirmation:
        description: "Type DESTROY to confirm if empty"
        required: true
        type: string
        default: "DESTROY"

permissions:
  contents: read

jobs:
  terraform-destroy:
    name: Destroy Azure Infrastructure
    runs-on: ubuntu-latest

    if: github.event.inputs.confirmation == 'DESTROY'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-destroy-${{ github.event.inputs.environment }}
      cancel-in-progress: false

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_admin_password: ${{ secrets.TF_VAR_admin_password }}
      TF_IN_AUTOMATION: true

      ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Terraform Workspace
        run: |
          terraform workspace select "$ENVIRONMENT"

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -var-file="environments/${ENVIRONMENT}.tfvars" \
            -out=destroy.tfplan

      - name: Terraform Destroy
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            destroy.tfplan
